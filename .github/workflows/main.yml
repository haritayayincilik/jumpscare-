
name: Android APK Derle

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Proje klasörünü bul
        run: |
          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f JumpscareGuard/gradlew ]; then
            echo "PROJECT_DIR=JumpscareGuard" >> $GITHUB_ENV
          else
            echo "Gradle projesi bulunamadı!"
            exit 1
          fi

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: JumpscareBekcisi-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
